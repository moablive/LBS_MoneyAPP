# =============================================================================
# MoneyAPP — only application services. PostgreSQL is intentionally OMITTED:
# we attach to the pre-existing `awlsrvDB_postgres` container via the shared
# external network `awl_network`.
#
# Prereq (one-time, run on the host if it does not exist):
#   docker network inspect awl_network >/dev/null 2>&1 || \
#     docker network create awl_network
#
# Run from this directory:
#   docker compose --env-file .env up -d --build
# =============================================================================

services:
  app_moneyapp_backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: app_moneyapp_backend
    env_file:
    - .env
    environment:
      NODE_ENV: production
      PORT: 3000
    networks:
      awl_network:
        aliases:
        - moneyapp_backend
    expose:
    - "3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  app_moneyapp_frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_LOGINHUB_API_URL: ${VITE_LOGINHUB_API_URL}
        VITE_LOGINHUB_APP_ID: ${VITE_LOGINHUB_APP_ID}
    container_name: app_moneyapp_frontend
    depends_on:
      app_moneyapp_backend:
        condition: service_healthy
    networks:
      awl_network:
        aliases:
        - moneyapp_frontend
    restart: unless-stopped

  app_moneyapp_bot:
    build:
      context: apps/bot/MoneyAPP_BOT
      dockerfile: Dockerfile
    container_name: app_moneyapp_bot
    env_file:
    # O bot tem seu próprio .env (TELEGRAM_BOT_TOKEN, LOGINHUB_*, GROQ_API_KEY,
    # BOT_SERVICE_KEY...) — o .env da raiz não contém essas variáveis.
    - apps/bot/MoneyAPP_BOT/.env
    environment:
      NODE_ENV: production
      BACKEND_URL: http://moneyapp_backend:3000/api
    depends_on:
      app_moneyapp_backend:
        condition: service_healthy
    networks:
      awl_network:
        aliases:
        - telegram_moneyapp_bot
    restart: unless-stopped

networks:
  # External — already exists on the host alongside `awlsrvDB_postgres`.
  # NOTE: the brief mentioned `awlsrv_network`, but the real network name on
  # this host (verified via `docker inspect awlsrvDB_postgres`) is `awl_network`.
  awl_network:
    external: true
